name: Sync qist/tvbox diff only
on:
  schedule:
    - cron: '0 12 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取本仓库代码
        uses: actions/checkout@v4

      - name: 拉取上游仓库
        uses: actions/checkout@v4
        with:
          repository: qist/tvbox
          ref: master
          path: upstream

      - name: 差异同步，仅拷贝新增/修改文件，跳过drpy.js，不删除本地文件
        run: |
          mkdir -p ./tvbox
          # rsync：排除 js/drpy.js，只同步改动文件，不删除本地文件
          rsync -av --exclude=js/drpy.js upstream/ ./tvbox/

      - name: 提交变更
        run: |
          git add tvbox/
          # 只有文件发生变化才提交，无变更直接跳过
          git commit -m "diff sync: update tvbox" || echo "文件无更新，跳过本次提交"
          git push