name: Sync qist/tvbox to tvbox folder
on:
  schedule:
    - cron: '0 0 * * *' # UTC 0点，北京时间早上8点自动同步
  workflow_dispatch: # 可以手动点按钮立即同步

permissions:
  contents: write # 允许action提交文件到你的仓库

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出你当前web仓库代码
        uses: actions/checkout@v4

      - name: 拉取 qist/tvbox 上游源码
        uses: actions/checkout@v4
        with:
          repository: qist/tvbox
          ref: master
          path: upstream

      - name: 复制全部文件到 tvbox 子目录（不碰仓库原有任何文件！）
        run: |
          mkdir -p ./tvbox
          cp -r upstream/* ./tvbox/
          rm -rf upstream

      - name: 提交更新
        run: |
          git config --global user.name "SyncBot"
          git config --global user.email "sync@example.com"
          git add tvbox/
          git commit -m "auto sync qist/tvbox latest" || echo "无变更无需提交"
          git push